{% comment %}
Opens an SSE connection that streams the user bubble and AI reply chunks into this fragment,
then on `done` reloads the canonical message log so tool calls render as collapsible pills.
{% endcomment %}
<div hx-ext="sse"
     sse-connect="{% url 'chat:stream_message' session.pk %}"
     sse-close="done"
     hx-trigger="sse:done"
     hx-get="{% url 'chat:message_log' session.pk %}"
     hx-target="#chat-log"
     hx-swap="innerHTML"
     class="d-flex flex-column gap-2"
     x-data
     x-init="new MutationObserver(() => {
         $refs.aiOut.innerHTML = renderMarkdown($refs.aiRaw.textContent);
     }).observe($refs.aiRaw, { childList: true, characterData: true, subtree: true })">
    <div class="chat-bubble align-self-end bg-primary text-white rounded p-2 px-3">{{ message }}</div>
    <div sse-swap="tool" class="align-self-start small text-muted fst-italic"></div>
    <div x-ref="aiRaw" sse-swap="ai-chunk" hx-swap="beforeend" class="d-none"></div>
    <div x-ref="aiOut" class="chat-bubble markdown-body align-self-start bg-white border rounded p-2 px-3"></div>
</div>
